name: SPX Momentum Test

on:
  workflow_dispatch: {}

jobs:
  run-momentum-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run momentum_test.py
        run: python momentum_test.py
