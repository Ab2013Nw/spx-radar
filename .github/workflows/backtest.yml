name: SPX Radar Backtest

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest.py
        run: python backtest.py

      - name: Commit results
        run: |
          git config user.name "spx-radar-bot"
          git config user.email "actions@github.com"
          git add backtest_results.csv
          git diff --cached --quiet || git commit -m "نتائج الاختبار التاريخي"
          git push
